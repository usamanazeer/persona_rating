version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  consul:
    image: consul:latest
    ports:
      - "8500:8500"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"

  postgres_auth:
    image: postgres:16
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata_auth:/var/lib/postgresql/data

  postgres_profile:
    image: postgres:16
    environment:
      POSTGRES_USER: profileuser
      POSTGRES_PASSWORD: profilepass
      POSTGRES_DB: profiledb
    ports:
      - "5433:5432"
    volumes:
      - pgdata_profile:/var/lib/postgresql/data

  authservice:
    build:
      context: ./AuthService/Api
    depends_on:
      - postgres_auth
      - rabbitmq
      - consul
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres_auth;Database=authdb;Username=authuser;Password=authpass
    ports:
      - "5001:80"

  profileservice:
    build:
      context: ./ProfileService/Api
    depends_on:
      - postgres_profile
      - rabbitmq
      - consul
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres_profile;Database=profiledb;Username=profileuser;Password=profilepass
    ports:
      - "5002:80"

  gateway:
    build:
      context: ./Gateway
    depends_on:
      - authservice
      - profileservice
    ports:
      - "8080:80"
    volumes:
      - ./Gateway/ocelot.json:/app/ocelot.json

volumes:
  pgdata_auth:
  pgdata_profile: 